{% extends "base.html" %}
{% block title %}Sign in | WatchVault{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Sign in</button></form>
<p>New to WatchVault? <a href="{% url 'signup' %}?next={{ request.GET.next|urlencode }}">Create an account</a>.</p>
{% endblock %}
