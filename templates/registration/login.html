{% extends "base.html" %}
{% block title %}Sign in | WatchVault{% endblock %}
{% block content %}
<section class="auth-page vault-page"><p class="eyebrow">MEMBER ACCESS</p><h1>Welcome back.</h1><p class="result-summary">Sign in to save shows and build your personal watchlist.</p><form method="post" class="auth-form">{% csrf_token %}{{ form.as_p }}<button class="button vault-button" type="submit">Sign in</button></form><p>New to WatchVault? <a href="{% url 'signup' %}?next={{ request.GET.next|urlencode }}">Create an account</a>.</p></section>
{% endblock %}
