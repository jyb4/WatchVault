<article class="watchlist-item-card">
  <a class="watchlist-show-link" href="{{ item.show.get_absolute_url }}"><span class="home-card-art">{% if item.show.poster_url %}<img data-poster-image src="{{ item.show.poster_url }}" alt="Poster for {{ item.show.title }}">{% endif %}<span class="poster-fallback home-poster-fallback{% if item.show.poster_url %} is-hidden{% endif %}" data-poster-fallback aria-label="No poster artwork"><strong>{{ item.show.title|slice:":1" }}</strong><small>NO POSTER</small></span><span class="rating-badge">★ {% if item.show.external_rating %}{{ item.show.external_rating }}{% else %}N/A{% endif %}</span></span><span class="home-card-body"><b title="{{ item.show.title }}">{{ item.show.title }}</b><small>{{ item.get_status_display }}</small></span></a>
</article>
