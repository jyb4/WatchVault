{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="WatchVault — curated TV discovery.">
  <title>{% block title %}WatchVault{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/search.css' %}">
</head>
<body>
  <header class="site-header">
    <nav aria-label="Primary navigation">
      <a class="brand" href="{% url 'home' %}">Watch<span>Vault</span></a>
      <a href="{% url 'show-list' %}">Discover</a>
      <form class="nav-search" method="get" action="{% url 'show-list' %}" role="search"><label class="sr-only" for="site-search">Search shows</label><input id="site-search" name="q" type="search" placeholder="Search shows, genres, people…"></form>
      {% if user.is_authenticated %}
        <a href="{% url 'watchlist' %}">My Watchlist</a>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
      {% else %}
        <a href="{% url 'login' %}">Sign in</a>
        <a href="{% url 'signup' %}">Join</a>
      {% endif %}
    </nav>
  </header>
  <main class="site-main">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <p>TV show information is sourced from <a href="https://www.tvmaze.com/">TVmaze</a>.</p>
  </footer>
</body>
</html>
